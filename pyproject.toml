[project]
name = "example"
description = "FastMCP project template"
version = "0.0.1"
requires-python = ">=3.15"

dependencies = [
    "fastmcp>=4.1.6",
]

[project.scripts]
example = "example.calculator:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "prek>=0.5.10",
    "pytest",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]
docs = [
    "mkdocstrings[python]>=1.0.8",
    "zensical>=0.1.0",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 98
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "W", "I", "N", "PT", "D", "UP", "RUF", "SIM", "S", "C4", "PTH", "PL", "PERF"]  # Choose your rule categories
ignore = ["D100", "D104", "D415"]
extend-ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "PLR2004"]  # Ignore docstring (D) and assert (S101) errors in tests

[tool.ruff.format]
quote-style = "double"

[tool.uv]
required-version = ">=0.13,<0.14"
