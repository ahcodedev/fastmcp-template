name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read # needed by release-drafter to read merged PRs in a private repo
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: main
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: false
        version: ">=0.13,<0.14"

    - name: Refresh draft release
      id: drafter
      uses: release-drafter/release-drafter@d1a19e60e81a7e650d00a7de9277f87e439117ea # v7.11.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Bump version
      env:
        VERSION: ${{ steps.drafter.outputs.resolved_version }}
      run: uv version "$VERSION"

    - name: Commit and push
      id: commit
      env:
        TAG: ${{ steps.drafter.outputs.tag_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # Skip the commit when pyproject.toml already has the release version
        if ! git diff --quiet -- pyproject.toml uv.lock; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Release $TAG"
          # Checkout doesn't persist credentials, so authenticate the push explicitly
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
        fi
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_ID: ${{ steps.drafter.outputs.id }}
        SHA: ${{ steps.commit.outputs.sha }}
      run: |
        gh api -X PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
          -F draft=false -f target_commitish="$SHA"

    - name: Build and upload artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.drafter.outputs.tag_name }}
      run: |
        uv build
        gh release upload "$TAG" dist/*
